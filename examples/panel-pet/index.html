<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>桌宠示例</title>
<!--
  桌宠面板（作品类型：面板 kind=panel / panel.mode="pet"）

  与普通面板的差别只有窗口形态：透明无边框固定尺寸（作品声明 mode:"pet"），
  页面自己负责三件事——
    1. body 背景必须透明（transparent），形状就是页面画出来的这个圆角身体；
    2. 拖动：身体上加 -webkit-app-region: drag（不需要任何特权 API），
       按钮等交互元素上要加 no-drag，否则点不到；
    3. 无边框窗口没有系统关闭钮：页面自带关闭按钮，POST {"action":"close"}。

  数据接口与普通面板完全一致：相对自己 fetch("./__pidesktop_state.json")
  读会话状态（只读）。本页每 5 秒拉一次：有会话在跑就在气泡里说一句，
  没有就说闲话。全部 createElement 构建，不拼 innerHTML，零依赖。

  发布（示例）：gallery_publish kind=panel path=examples/panel-pet/index.html
  panel={mode:"pet",width:280,height:340}   // 尺寸 = 桌宠窗口的固定大小
-->
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    -webkit-app-region: drag;                /* 整个身体可拖动 */
    -webkit-user-select: none;
    user-select: none;
    font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 18px; box-sizing: border-box;
  }
  /* 气泡：桌宠说话的地方（拖动区内的可读内容，不需要交互） */
  .bubble {
    max-width: 240px; margin-bottom: 10px; padding: 8px 12px;
    border-radius: 12px; border-bottom-left-radius: 3px;
    background: #1f2b26; color: #eaf6ef;
    box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .6);
    font-size: 12.5px; text-align: center;
  }
  /* 身体：圆角矩形宠物本体（形状由它决定，页面其余区域是透明的） */
  .pet {
    position: relative; width: 150px; height: 150px; border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 34% 28%, #3d5a4e 0%, #16332c 62%);
    box-shadow: 0 18px 30px -18px rgba(8, 30, 22, .8);
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .eye { width: 16px; height: 22px; border-radius: 50%; background: #f2fbf5; position: relative; }
  .eye::after { content: ""; position: absolute; left: 4px; top: 7px; width: 8px; height: 9px; border-radius: 50%; background: #10231d; }
  .pet.busy .eye::after { animation: blink 1.1s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: none; } 96% { transform: scaleY(.12); } }
  /* 交互元素必须 no-drag，否则在 drag 区域里点不到 */
  .close {
    -webkit-app-region: no-drag;
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
    border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(242, 251, 245, .16); color: #eaf6ef; font-size: 13px; line-height: 22px;
  }
  .close:hover { background: #c93a50; }
  .home {
    -webkit-app-region: no-drag;
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border: 0; border-radius: 999px; padding: 2px 10px; cursor: pointer;
    background: #0f211b; color: #9fc3b2; font-size: 11px;
  }
  .home:hover { color: #eaf6ef; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bubble" id="bubble">你好，我是桌宠。</div>
    <div class="pet" id="pet"><span class="eye"></span><span class="eye"></span></div>
  </div>
<script>
  "use strict";
  const bubble = document.getElementById("bubble");
  const pet = document.getElementById("pet");
  const IDLE = ["在呢。", "今天写点什么？", "喝口水，休息一下眼睛。", "有事点下面的按钮唤回主界面。"];

  function say(text) { bubble.textContent = text; }

  function refresh() {
    fetch("./__pidesktop_state.json", { cache: "no-store" })
      .then((response) => (response.ok ? response.json() : null))
      .then((state) => {
        if (!state || !Array.isArray(state.live)) { say("（读不到会话状态）"); return; }
        const busy = state.live.filter((session) => session.busy);
        pet.classList.toggle("busy", busy.length > 0);
        if (busy.length > 0) {
          const names = busy.flatMap((session) => (Array.isArray(session.currentTools) ? session.currentTools.slice(0, 2) : [])).map((tool) => tool.name || tool);
          say(busy.length === 1 && names.length > 0 ? `正在跑 ${names[0]}…` : `${busy.length} 个会话在跑…`);
        } else {
          say(IDLE[Math.floor(Math.random() * IDLE.length)]);
        }
      })
      .catch(() => say("（读不到会话状态）"));
  }

  function post(action) {
    fetch("./__pidesktop_state.json", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action }) }).catch(() => undefined);
  }

  const close = document.createElement("button");
  close.className = "close"; close.type = "button"; close.title = "关闭桌宠"; close.textContent = "×";
  close.addEventListener("click", () => post("close"));
  const home = document.createElement("button");
  home.className = "home"; home.type = "button"; home.textContent = "回主界面";
  home.addEventListener("click", () => post("show-main"));
  pet.append(close, home);

  refresh();
  window.setInterval(refresh, 5000);
</script>
</body>
</html>
