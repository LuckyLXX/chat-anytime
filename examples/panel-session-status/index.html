<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会话监控</title>
<!--
  会话监控面板（作品类型：面板 / kind=panel）

  数据接口（相对本文档，无需知道端口与 token）：
    GET  ./__pidesktop_state.json        → PanelStatePayload（只读）
    POST ./__pidesktop_state.json        → {"action":"show-main"} 唤回主界面

  载荷形状见 src/shared/protocol.ts 的 PanelStatePayload：
    { generatedAt, activeSessionId?, app:{version,agentName,workspace}, sessions:[SessionSummary], live:[PanelSessionLive] }
  其中 live 只包含「还活在运行时里」的会话，带 busy / status / currentTools / todos。
  主界面关掉（退到托盘）之后这个端点照样有数据 —— 面板独立于主界面存活。

  本页只关心两件事：**此刻有谁在跑**、以及**刚刚跑完的会话是什么结果**。因此：
    · 「运行中」只渲染 live 里 busy === true 的会话（空闲会话与历史话题一律不显示，
      需要看话题就回主界面）；
    · 每个正在执行的工具给一个图标（图标本身说明在跑什么），配名称 / 中文说明 / 已耗时；
    · todo 直接铺开成任务清单（每项标记「已完成 / 正在进行 / 未开始」），超过
      8 项先收、按钮展开；面板本身就是滚动容器，不用把清单藏起来；
    · 「刚刚结束」是本页**自己记住**的（一个会话从 busy 变成不 busy 的那一秒），
      保留到面板关闭或点「清空」为止——结束态从载荷的 runStatus 读（已完成 / 失败 /
      已中止），读不到就记中性的「已结束」。这层记忆纯属页面内状态，不落盘、不改平台。
  载荷里的 sessions / activeSessionId 只在「刚打开面板时补一屏刚结束的会话」时用
  （用 msgTime 判断新鲜度），其余不消费。

  视觉：页内渐变光斑底 + backdrop-filter 毛玻璃卡片。面板窗口本身是不透明窗口
  （transparent 未开，属于平台侧代码），所以玻璃只磨页内背景，不会透出桌面壁纸。

  零依赖：不引任何 CDN、不打包，双击改完就能跑。全部用 createElement / createElementNS
  构建，不给用户与 AI 来源的文本拼 innerHTML（图标是常量定义，走同一套 NS 构建）。
-->
<style>
  :root {
    color-scheme: light dark;
    /* 文字与线条 */
    --text: #171b21;
    --muted: #5b6472;
    --faint: #8c95a3;
    --stroke: rgba(18, 26, 44, .10);
    --stroke-soft: rgba(18, 26, 44, .06);
    /* 玻璃 */
    --glass: rgba(255, 255, 255, .62);
    --glass-soft: rgba(255, 255, 255, .40);
    --glass-strong: rgba(255, 255, 255, .78);
    --highlight: rgba(255, 255, 255, .85);
    --shadow: 0 16px 36px -22px rgba(16, 30, 60, .55);
    /* 语义色 */
    --accent: #3b76f0;
    --accent-soft: rgba(59, 118, 240, .13);
    --ok: #2fa46a;
    --run: #d9922a;
    --fail: #d0504c;
    --idle: #9aa2ae;
    --track: rgba(18, 26, 44, .09);
    /* 背景光斑 */
    --page-1: #eef2fb;
    --page-2: #e8edf9;
    --page-3: #eef0f6;
    --blob-a: #9dbcff;
    --blob-b: #c9b4ff;
    --blob-c: #9fe0d6;
    --blob-opacity: .55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e9ecf2;
      --muted: #a3abb9;
      --faint: #7d8796;
      --stroke: rgba(255, 255, 255, .10);
      --stroke-soft: rgba(255, 255, 255, .06);
      --glass: rgba(32, 36, 45, .58);
      --glass-soft: rgba(32, 36, 45, .38);
      --glass-strong: rgba(34, 38, 48, .78);
      --highlight: rgba(255, 255, 255, .09);
      --shadow: 0 18px 40px -24px rgba(0, 0, 0, .85);
      --accent: #7ba4ff;
      --accent-soft: rgba(123, 164, 255, .16);
      --ok: #58c98d;
      --run: #e5b45c;
      --fail: #f0817c;
      --idle: #6d7684;
      --track: rgba(255, 255, 255, .10);
      --page-1: #12141a;
      --page-2: #161a22;
      --page-3: #101317;
      --blob-a: #2c4a8f;
      --blob-b: #4a3583;
      --blob-c: #1f5b52;
      --blob-opacity: .5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    position: relative;
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, var(--page-1), var(--page-2) 55%, var(--page-3));
    color: var(--text);
    font: 400 12.5px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景：慢速漂移的光斑（毛玻璃的「底」） ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg::after {
    content: ""; position: absolute; inset: -15%;
    background:
      radial-gradient(120% 85% at 12% -5%, rgba(255, 255, 255, .55), transparent 62%),
      radial-gradient(95% 75% at 105% 108%, rgba(255, 255, 255, .32), transparent 58%);
  }
  @media (prefers-color-scheme: dark) {
    .bg::after {
      background:
        radial-gradient(120% 85% at 12% -5%, rgba(255, 255, 255, .06), transparent 62%),
        radial-gradient(95% 75% at 105% 108%, rgba(255, 255, 255, .04), transparent 58%);
    }
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(52px);
    opacity: var(--blob-opacity); will-change: transform;
  }
  .blob-a { width: 300px; height: 300px; left: -80px; top: -90px; background: var(--blob-a); animation: drift-a 26s ease-in-out infinite alternate; }
  .blob-b { width: 250px; height: 250px; right: -90px; top: 96px; background: var(--blob-b); animation: drift-b 33s ease-in-out infinite alternate; }
  .blob-c { width: 280px; height: 280px; left: 30px; bottom: -120px; background: var(--blob-c); animation: drift-c 39s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(46px, 34px, 0) scale(1.14); } }
  @keyframes drift-b { from { transform: translate3d(0, 0, 0) scale(1.06); } to { transform: translate3d(-40px, 44px, 0) scale(.94); } }
  @keyframes drift-c { from { transform: translate3d(0, 0, 0) scale(.98); } to { transform: translate3d(38px, -30px, 0) scale(1.12); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---------- 玻璃表面的统一配方 ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(165%);
    backdrop-filter: blur(20px) saturate(165%);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow), inset 0 1px 0 var(--highlight);
  }

  /* ---------- 顶栏 ---------- */
  .bar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    border-width: 0 0 1px;
    border-radius: 0;
  }
  .bar strong { font-size: 12.5px; font-weight: 650; letter-spacing: .01em; }
  .bar .spacer { flex: 1 1 auto; }
  .bar .meta {
    color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
    padding: 2px 7px; border-radius: 99px; background: var(--glass-soft);
    border: 1px solid var(--stroke-soft);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 99px; font-size: 10.5px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
    font-variant-numeric: tabular-nums;
  }
  .pill[hidden] { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: 0 0 auto; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.run { background: var(--run); box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 22%, transparent); animation: pulse 1.6s ease-in-out infinite; }
  .dot.offline { background: var(--fail); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fail) 22%, transparent); }
  .dot.pending { animation: pulse 1.4s ease-in-out infinite; }
  .ghost {
    padding: 4px 10px; border-radius: 9px; font: inherit; font-size: 11.5px; cursor: pointer;
    color: var(--text); background: var(--glass-soft); border: 1px solid var(--stroke);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: color .16s ease, border-color .16s ease, background .16s ease, transform .12s ease;
  }
  .ghost:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--stroke)); background: var(--glass-strong); }
  .ghost:active { transform: scale(.97); }
  .ghost:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }

  /* ---------- 连接失败提示 ---------- */
  .banner {
    position: relative; z-index: 2;
    margin: 10px 12px 0; padding: 8px 11px; border-radius: 12px;
    border-color: color-mix(in srgb, var(--fail) 34%, var(--stroke));
    background: color-mix(in srgb, var(--fail) 12%, var(--glass));
    color: color-mix(in srgb, var(--fail) 82%, var(--text));
    font-size: 11.5px;
  }
  .banner[hidden] { display: none; }

  /* ---------- 主体 ---------- */
  main {
    position: relative; z-index: 1;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 11px 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 99px; }
  main::-webkit-scrollbar-thumb:hover { background: var(--faint); }

  .card {
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px; border-radius: 16px;
  }
  /* 只有「新出现的会话」才播入场：工具起停会不断改变签名，
     每次重绘都淡入的话整张卡会持续闪烁。 */
  .card.enter { animation: card-in .26s cubic-bezier(.22, .8, .3, 1) both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }

  .card-head { display: flex; align-items: center; gap: 7px; }
  .card-title {
    flex: 0 1 auto; min-width: 0; font-size: 13px; font-weight: 620;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-space {
    flex: 1 1 auto; min-width: 0; text-align: right;
    color: var(--faint); font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl;
  }

  .status { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
  .status .beacon {
    position: relative; width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
    background: var(--run);
  }
  .status .beacon::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid currentColor; color: var(--run); opacity: .45;
    animation: beacon 1.8s ease-out infinite;
  }
  @keyframes beacon { 0% { transform: scale(.6); opacity: .5; } 100% { transform: scale(1.5); opacity: 0; } }
  .status .beacon.still { background: var(--ok); }
  .status .beacon.still::after { display: none; }
  .status .beacon.idle { background: var(--idle); }
  .status .beacon.idle::after { display: none; }
  .status .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 正在执行的工具 ---------- */
  .tools { display: flex; flex-direction: column; gap: 5px; }
  .tool {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 11px;
    background: var(--glass-soft); border: 1px solid var(--stroke-soft);
  }
  .tool .icon {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .tool .icon svg { width: 13px; height: 13px; display: block; }
  .tool .name {
    flex: 1 1 auto; min-width: 0;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool .label {
    flex: 0 0 auto; max-width: 40%; color: var(--muted); font-size: 10.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool .time {
    flex: 0 0 auto; color: var(--muted); font-size: 10.5px;
    font-variant-numeric: tabular-nums; min-width: 34px; text-align: right;
  }
  .spinner {
    flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 30%, var(--run) 78% 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 3.4px, #000 3.6px);
    mask: radial-gradient(circle, transparent 0 3.4px, #000 3.6px);
    animation: spin 1.05s linear infinite;
  }
  .more { color: var(--faint); font-size: 10.5px; padding-left: 4px; }

  /* ---------- todo ---------- */
  .todo { display: flex; flex-direction: column; gap: 6px; }
  .todo-head {
    display: flex; align-items: baseline; gap: 8px;
    color: var(--muted); font-size: 11px;
  }
  .todo-head .count { font-variant-numeric: tabular-nums; }
  .todo-head .spacer { flex: 1 1 auto; }
  .todo-head .pct { color: var(--faint); font-variant-numeric: tabular-nums; }
  .bar-track { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--ok));
    box-shadow: 0 0 14px -3px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: width .35s cubic-bezier(.22, .8, .3, 1);
  }
  .todo-list { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .todo-list li {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 5px 8px; border-radius: 10px;
    background: var(--glass-soft); border: 1px solid var(--stroke-soft);
  }
  .todo-list li.current {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .todo-list .mark {
    flex: 0 0 auto; width: 11px; text-align: center;
    font-size: 10px; line-height: 1.6; color: var(--faint);
  }
  .todo-list li.done .mark { color: var(--ok); }
  .todo-list li.current .mark { color: var(--accent); }
  .todo-list .text {
    flex: 1 1 auto; min-width: 0; font-size: 11.5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .todo-list li.done .text {
    color: var(--muted); text-decoration: line-through;
    text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent);
  }
  .todo-list .state { flex: 0 0 auto; font-size: 10px; line-height: 1.75; color: var(--faint); }
  .todo-list li.done .state { color: var(--faint); }
  .todo-list li.current .state { color: var(--accent); font-weight: 600; }
  .todo-more { align-self: center; margin-top: 1px; }

  /* ---------- 分组标题 ---------- */
  .section-head {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 4px 0; color: var(--muted);
    font-size: 10.5px; letter-spacing: .04em;
  }
  .section-head .spacer { flex: 1 1 auto; }
  .ghost.small { padding: 2px 9px; font-size: 10.5px; border-radius: 8px; }

  /* ---------- 刚刚结束（本页记忆，不自动过期） ---------- */
  .result {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 13px;
  }
  .result.enter { animation: card-in .26s cubic-bezier(.22, .8, .3, 1) both; }
  .result.ok { border-color: color-mix(in srgb, var(--ok) 34%, var(--stroke)); }
  .result.fail { border-color: color-mix(in srgb, var(--fail) 38%, var(--stroke)); }
  .result .verdict {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    /* 固定徐标列宽：三个字/两个字的结束态混排时，标题左缘才对得齐。 */
    min-width: 64px; padding: 3px 9px; border-radius: 99px;
    font-size: 10.5px; font-weight: 620; letter-spacing: .02em;
  }
  .result .verdict svg { width: 11px; height: 11px; display: block; }
  .result.ok .verdict { background: color-mix(in srgb, var(--ok) 17%, transparent); color: var(--ok); }
  .result.fail .verdict { background: color-mix(in srgb, var(--fail) 17%, transparent); color: var(--fail); }
  .result.idle .verdict { background: color-mix(in srgb, var(--idle) 20%, transparent); color: var(--muted); }
  .result .title {
    flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 560;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result .at { flex: 0 0 auto; color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }

  /* ---------- 空态 ---------- */
  .empty {
    margin: auto; display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 20px 12px; text-align: center;
    animation: card-in .3s cubic-bezier(.22, .8, .3, 1) both;
  }
  .empty .badge {
    width: 46px; height: 46px; border-radius: 16px;
    display: grid; place-items: center; color: var(--faint);
  }
  .empty .badge svg { width: 20px; height: 20px; }
  .empty .title { font-size: 12.5px; font-weight: 600; }
  .empty .hint { font-size: 11px; color: var(--faint); max-width: 240px; }

  /* ---------- 底栏 ---------- */
  footer {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-width: 1px 0 0; border-radius: 0;
    color: var(--faint); font-size: 10.5px;
  }
  footer .spacer { flex: 1 1 auto; }
  footer .app { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .app b { font-weight: 600; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .card, .empty { animation: none; }
    .status .beacon::after { display: none; }
    .spinner { animation-duration: 2.6s; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="bar glass">
    <span class="dot pending" id="conn"></span>
    <strong>会话监控</strong>
    <span class="pill" id="count" hidden></span>
    <span class="spacer"></span>
    <span class="meta" id="meta">连接中…</span>
    <button class="ghost" id="show-main" title="回到 ChatAnyTime 主界面">主界面</button>
  </header>

  <div class="banner glass" id="banner" hidden></div>
  <main id="root"></main>

  <footer class="glass">
    <span class="app" id="app-info">—</span>
    <span class="spacer"></span>
    <span>每 1 秒刷新</span>
  </footer>

<script>
(function () {
  "use strict";

  var ENDPOINT = "./__pidesktop_state.json";
  var POLL_MS = 1000;
  var MAX_TOOL_ROWS = 6;          // 一张卡最多铺几行工具，超出的折成「还有 N 个」
  var TODO_VISIBLE_LIMIT = 8;     // 任务清单默认铺几项，超出的先收（面板一屏放不下）
  var SVG_NS = "http://www.w3.org/2000/svg";

  var root = document.getElementById("root");
  var banner = document.getElementById("banner");
  var meta = document.getElementById("meta");
  var conn = document.getElementById("conn");
  var count = document.getElementById("count");
  var appInfo = document.getElementById("app-info");

  var latest = null;
  var currentSignature = "";
  var failures = 0;
  /** 已经渲染过的运行中会话：新进来的那一个才播入场动画（见 .card.enter）。 */
  var seenSessions = {};
  /**
   * 「刚刚结束」列表：本页自己记的（面板关掉就没了，不落盘、不动平台）。
   * 一个会话从 busy 变成不 busy 的那一刻入列，结束态从载荷的 runStatus 读。
   */
  var finished = [];
  /** 上一轮各会话的 busy 状态（只用来识别 true→false 这个沿）。 */
  var wasBusy = {};
  var seededFinished = false;

  /** 刚打开面板时，多新算「刚刚结束」：更早的不补，免得把几天前的结果重新翻出来。 */
  var FINISHED_SEED_MS = 10 * 60 * 1000;
  /** 哪些会话的任务清单被展开过（按会话记，重绘不丢）。 */
  var expandedTodos = {};

  /* ---------------- 元素构建（一律 textContent，绝不拼 HTML） ---------------- */

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);

  /**
   * 从每一帧里认「刚结束」：busy true→false 是唯一可靠的结束信号（readme 说的

   * 面板可能在会话跑完之后才被打开。

        forgetFinished(item.sessionId);
        continue;

        rememberFinished(item, item.runStatus, now);
        continue;

  /* ---------------- 渲染 ---------------- */

  function busySessions(data) {

    for (var i = 0; i < live.length; i += 1) {
      if (live[i].busy) busy.push(live[i]);
    }
    return busy;
  }

  function render() {
    var data = latest;
    var scrollTop = root.scrollTop;
    root.textContent = "";
    if (!data) {
      root.appendChild(el("div", "empty", "等待状态数据…"));
      return;
    }
    var busy = busySessions(data);
    if (busy.length === 0) seenSessions = {};
    if (busy.length > 0) {
      root.appendChild(sectionHead("运行中 · " + busy.length));
      var nextSeen = {};
      for (var i = 0; i < busy.length; i += 1) {
        var id = busy[i].sessionId;
        nextSeen[id] = true;
        root.appendChild(renderCard(busy[i], !seenSessions[id]));

      // 只在「正在跑的集合」里记：一个会话转空闲又重新开始跑时会重新播一次。
      seenSessions = nextSeen;
    }

    // 结果区不自动过期（面板关掉就没了），所以把「清空」交给用户。
    if (finished.length > 0) {
      var clear = el("button", "ghost small", "清空");
      clear.type = "button";
      clear.title = "只清空这个面板上的结果列表，不影响主程序里的会话";
      clear.addEventListener("click", function () {
        finished = [];
        render();

      root.appendChild(sectionHead("刚刚结束 · " + finished.length, clear));
      for (var f = 0; f < finished.length; f += 1) root.appendChild(renderResult(finished[f]));

  function setConnected(ok) {

  }

  /**
   * 渲染签名：只包含真正影响画面的字段（会话 id / 状态 / 工具名与起始时间 / todo 计数 / 结果列表）
   * ——签名不变就只刷新耗时，整树重绘会重置滚动位置与卡片入场动画。
   */
  function signature(data) {
    var parts = [];
    var busy = busySessions(data);
    for (var i = 0; i < busy.length; i += 1) {
      var item = busy[i];
      var tools = (item.currentTools || []).map(function (tool) {
        return tool.name + "@" + tool.startedAt;
      }).join(",");
      var summary = item.todoSummary || { total: 0, completed: 0, inProgress: 0 };
      // 清单已经铺开了，所以签名里得带上每项的状态（c/i/p）与内容总长，
      // 否则 todo_write 改了清单而不动工具时面板不会重绘。
      var todos = item.todos || [];
      var todoDigest = todos.map(function (todo) {
        return String(todo.status || "pending").charAt(0);
      }).join("") + ":" + todos.reduce(function (sum, todo) {
        return sum + String(todo.content || "").length;
      }, 0);
      parts.push([
        item.sessionId, item.title, item.workspace, item.status, tools,
        summary.total, summary.completed, summary.inProgress, todoDigest
      ].join("|"));
    }
    for (var f = 0; f < finished.length; f += 1) {
      parts.push("f:" + finished[f].sessionId + ":" + finished[f].status + ":" + finished[f].finishedAt);
    }
    return parts.join("\n");
  }

  function poll() {
    fetch(ENDPOINT, { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(function (data) {
        failures = 0;
        setConnected(true);
        trackFinished(data);
        var next = signature(data);
        var changed = next !== currentSignature;
        latest = data;
        currentSignature = next;
        meta.textContent = formatClock(data.generatedAt || Date.now());
        var app = data.app || {};
        appInfo.textContent = [app.agentName, app.version ? "v" + app.version : ""].filter(Boolean).join(" · ") || "ChatAnyTime";
        renderCount(data);
        if (changed) render();
        else tickElapsed();
      })
      .catch(function () {
        failures += 1;
        setConnected(false);
        if (!latest) render();
      });
  }

  document.getElementById("show-main").addEventListener("click", function () {
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "show-main" })
    }).catch(function () { /* 主界面打不开也不该让面板报错 */ });
  });

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
