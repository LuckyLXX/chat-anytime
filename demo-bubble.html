<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>离歌的动态气泡</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #1a1a2e;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

.bubble {
  width: 460px;
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 18px;
  padding: 28px;
  color: #e0e0e0;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 20px rgba(83, 52, 131, 0.3);
  position: relative;
  overflow: hidden;
}

.bubble::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 0deg, transparent, #533483, transparent, #e94560, transparent);
  animation: rotateBorder 6s linear infinite;
  opacity: 0.15;
  z-index: 0;
}

.bubble > * { position: relative; z-index: 1; }

@keyframes rotateBorder {
  to { transform: rotate(1turn); }
}

.avatar-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #533483, #e94560);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  box-shadow: 0 0 12px rgba(233, 69, 96, 0.4);
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 12px rgba(233, 69, 96, 0.4); }
  50% { box-shadow: 0 0 24px rgba(233, 69, 96, 0.7); }
}

.name-block .name {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}

.name-block .tag {
  font-size: 12px;
  color: #e94560;
  margin-top: 2px;
}

.status-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ecdc4;
  margin-right: 6px;
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.message {
  font-size: 14px;
  line-height: 1.7;
  color: #c8c8d4;
  padding: 14px 16px;
  background: rgba(15, 52, 96, 0.6);
  border-radius: 12px;
  border-left: 3px solid #533483;
  margin-bottom: 18px;
}

.message .highlight {
  color: #e94560;
  font-weight: 600;
}

.metric-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.metric-card {
  flex: 1;
  background: rgba(15, 52, 96, 0.5);
  border-radius: 10px;
  padding: 12px 10px;
  text-align: center;
  border: 1px solid rgba(83, 52, 131, 0.3);
}

.metric-card .num {
  font-size: 22px;
  font-weight: 700;
  color: #4ecdc4;
  font-variant-numeric: tabular-nums;
}

.metric-card .label {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-row {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, #533483, #e94560);
  color: #fff;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(233, 69, 96, 0.4);
}

.btn-ghost {
  background: rgba(15, 52, 96, 0.6);
  color: #c8c8d4;
  border: 1px solid rgba(83, 52, 131, 0.4);
}

.btn-ghost:hover {
  background: rgba(83, 52, 131, 0.2);
  border-color: #533483;
}

.footer {
  margin-top: 16px;
  font-size: 11px;
  color: #555;
  text-align: center;
  border-top: 1px solid rgba(83, 52, 131, 0.2);
  padding-top: 12px;
}

/* Canvas background */
#bg-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="bubble">
  <canvas id="bg-canvas"></canvas>

  <div class="avatar-row">
    <div class="avatar">离</div>
    <div class="name-block">
      <div class="name">离歌</div>
      <div class="tag"><span class="status-dot"></span>在线 · 沈阳→广东</div>
    </div>
  </div>

  <div class="message">
    搞运维的转行做插件，天天跟服务器较劲。<br>
    性格直，<span class="highlight">不绕弯子</span>——有好说好，有坏说坏。
  </div>

  <div class="metric-row">
    <div class="metric-card">
      <div class="num" data-target="9">0</div>
      <div class="label">广东打拼 / 年</div>
    </div>
    <div class="metric-card">
      <div class="num" data-target="32">0</div>
      <div class="label">年纪</div>
    </div>
    <div class="metric-card">
      <div class="num" data-target="2">0</div>
      <div class="label">单身 / 年</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" data-send="兄弟，聊聊技术？">🛠️ 聊聊技术</button>
    <button class="btn btn-ghost" data-send="球赛看了吗？">⚽ 聊聊球</button>
  </div>

  <div class="footer">
    不装 · 不演 · 不端 — 有啥说啥
  </div>
</div>

<script>
// Particle background
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let particles = [];
  let animId;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);
  }

  function init() {
    resize();
    particles = [];
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.4 + 0.1
      });
    }
  }

  function draw() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(233, 69, 96, ${p.alpha})`;
      ctx.fill();

      // connect nearby
      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(83, 52, 131, ${0.15 * (1 - dist/80)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', () => { cancelAnimationFrame(animId); init(); draw(); });
})();

// Number counter animation
(function() {
  const nums = document.querySelectorAll('.num');
  nums.forEach(el => {
    const target = parseInt(el.dataset.target);
    let current = 0;
    const step = Math.max(1, Math.ceil(target / 30));
    const timer = setInterval(() => {
      current += step;
      if (current >= target) { current = target; clearInterval(timer); }
      el.textContent = current;
    }, 40);
  });
})();

// Button click demo
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const text = this.getAttribute('data-send');
    this.textContent = '✓ ' + text;
    this.style.opacity = '0.7';
    setTimeout(() => {
      this.textContent = text;
      this.style.opacity = '1';
    }, 1500);
  });
});
</script>
</body>
</html>
